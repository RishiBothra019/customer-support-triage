[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-triage-env"
version = "1.0.0"
description = "OpenEnv environment for customer support ticket triage"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Rishi Bothra", email = "your-email@example.com"}
]
keywords = ["openenv", "reinforcement-learning", "customer-support", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.9.2",
    "fastapi>=0.115.2",
    "uvicorn>=0.30.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "black>=24.10.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[project.urls]
"Homepage" = "https://huggingface.co/spaces/rishibothra/customer-support-triage"
"Bug Reports" = "https://github.com/rishibothra/customer-support-triage/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["my_env_v4*"]   # because my_env_v4.py is at root

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
